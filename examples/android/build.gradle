buildscript {
    repositories {
        mavenCentral()
    }

    dependencies {
 		classpath 'com.android.tools.build:gradle:1.0.1'
    }
}

apply plugin: 'com.android.application'

android {
    compileSdkVersion 20
    buildToolsVersion "20.0.0"
    defaultConfig {
        minSdkVersion 13
        targetSdkVersion 20
    }
    
    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            res.srcDirs = ['res']
            assets.srcDirs = ['assets']
        }
    }
}

repositories {
	mavenLocal()
	mavenCentral()
}

dependencies {
	compile 'io.ensox.exlua:exluaj-jse:3.0.1-exlua.1'
}
