plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'io.ensox.exlua'
version = '3.0.1-exlua.1'

repositories { mavenCentral() }

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
    withSourcesJar()
}

sourceSets {
    main {
        java.srcDirs = ['src/core', 'src/jse']
        java.include '**/*.java'
        resources { srcDir 'src/jse'; include 'META-INF/**' }
    }
    test {
        java.srcDirs = ['test/exlua', 'test/junit']
        java.exclude '**/AllTests.java', '**/ScriptDrivenTest.java', '**/CompatibiltyTest.java',
            '**/ErrorsTest.java', '**/MathLibTest.java', '**/compiler/AbstractUnitTests.java',
            '**/compiler/CompilerUnitTests.java', '**/compiler/RegressionTests.java',
            '**/compiler/LuaParserTests.java', '**/lib/jse/OsLibTest.java'
    }
}

dependencies {
    // LuaJC is an optional API; the interpreter does not load BCEL.
    compileOnly 'org.apache.bcel:bcel:5.2'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.luaj:luaj-jse:3.0.1'
    testRuntimeOnly 'org.apache.bcel:bcel:5.2'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:-options', '-Xlint:-removal']
}

test { useJUnit() }

jar { from('LICENSE') { into 'META-INF/licenses/exluaj' } }

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            pom {
                name = 'ExLuaJ'
                description = 'ExLua language extensions on the LuaJ 3.0.1 JVM runtime'
                url = 'https://github.com/enso-x/exluaj'
                licenses { license { name = 'MIT'; url = 'https://opensource.org/license/mit' } }
                scm { url = 'https://github.com/enso-x/exluaj' }
                withXml {
                    def dependencies = asNode().appendNode('dependencies')
                    def bcel = dependencies.appendNode('dependency')
                    bcel.appendNode('groupId', 'org.apache.bcel')
                    bcel.appendNode('artifactId', 'bcel')
                    bcel.appendNode('version', '5.2')
                    bcel.appendNode('optional', 'true')
                }
            }
        }
    }
}

// Releases go to the static Maven repository enso-x/maven, served by GitHub Pages at
// https://enso-x.github.io/maven/. `gradlew publishPages` writes into a local clone of it
// (-PmavenRepo=<dir>, default ~/Projects/maven), commits and pushes. A released version is
// never overwritten: consumers and their caches rely on it staying the same.
def pagesRepo = file(providers.gradleProperty('mavenRepo')
    .orElse(new File(System.getProperty('user.home'), 'Projects/maven').path).get())

publishing {
    repositories {
        maven {
            name = 'pages'
            url = pagesRepo.toURI()
        }
    }
}

def releasedDir = new File(pagesRepo, "${project.group.replace('.', '/')}/${rootProject.name}/${project.version}")

tasks.register('checkUnreleased') {
    doLast {
        if (!new File(pagesRepo, '.git').isDirectory()) throw new GradleException("No clone of enso-x/maven at $pagesRepo")
        if (releasedDir.exists()) throw new GradleException("${project.version} is already released; bump the version")
    }
}
tasks.matching { it.name == 'publishMavenJavaPublicationToPagesRepository' }.configureEach { dependsOn 'checkUnreleased', 'test' }

tasks.register('publishPages') {
    group = 'publishing'
    description = 'Publishes to the enso-x/maven GitHub Pages repository and pushes it.'
    dependsOn 'publishMavenJavaPublicationToPagesRepository'
    doLast {
        def git = { List<String> args ->
            def process = (['git', '-C', pagesRepo.path] + args).execute()
            process.waitForProcessOutput(System.out, System.err)
            if (process.exitValue() != 0) throw new GradleException("git ${args.join(' ')} failed")
        }
        git(['add', '-A'])
        git(['commit', '-m', "${project.group}:${rootProject.name}:${project.version}"])
        git(['push'])
    }
}
